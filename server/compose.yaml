services:
  starpet-api:
    build: .
    container_name: starpet-english
    restart: unless-stopped
    ports:
      - "3210:8000"
    environment:
      STARPET_DATABASE: /data/starpet.db
      STARPET_SPEECH_MODEL: /models/vosk-model-small-en-us-0.15
      STARPET_WHISPER_URL: http://starpet-asr:8080
    volumes:
      - ./data:/data
      - ./models:/models:ro
      - ./downloads:/app/app/static/downloads:ro
    mem_limit: 1g
    cpus: 2
    depends_on:
      starpet-asr:
        condition: service_healthy
  starpet-asr:
    build:
      context: ./asr
    image: starpet-asr:whisper-1.9.5
    container_name: starpet-asr
    restart: unless-stopped
    volumes:
      - ./models:/models:ro
    read_only: true
    mem_limit: 2g
    cpus: 2
    pids_limit: 64
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
